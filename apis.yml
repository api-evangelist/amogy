name: Amogy
description: >-
  Amogy is an energy-technology company decarbonizing hard-to-electrify sectors
  by converting energy-dense ammonia into dispatchable, zero-carbon electricity.
  Its AMMDrive power systems crack ammonia into hydrogen and nitrogen and convert
  the hydrogen to power for data centers, industrial facilities, microgrids, and
  maritime vessels, and it develops proprietary low-temperature ammonia-cracking
  catalysts. Backed by DCVC and other investors, Amogy has demonstrated the
  world's first carbon-free ammonia-powered maritime vessel and partners with
  firms such as Samsung Heavy Industries and Mitsubishi. This is a company
  profile in the API Evangelist network; Amogy publishes no public developer API
  surface at this time, so this record captures its corporate identity and
  public web properties rather than API artifacts.
